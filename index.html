<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a url('https://i.imgur.com/nan7pSN.png') center center;
            background-size: cover;
            background-attachment: fixed;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-container {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .filter-select {
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            background: white;
            cursor: pointer;
            min-width: 120px;
        }

        .filter-select:focus {
            border-color: #667eea;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .add-btn {
            width: 44px;
            height: 44px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .add-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .auth-btn {
            height: 44px;
            padding: 0 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .auth-btn:hover {
            background: #5568d3;
        }

        .auth-btn.logout {
            background: #6c757d;
        }

        .auth-btn.logout:hover {
            background: #5a6268;
        }

        .recipes-grid {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .recipe-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .recipe-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .recipe-card.expanded {
            cursor: default;
        }

        .recipe-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 14px;
            background: #eee;
            display: block;
        }

        .recipe-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .recipe-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
            word-break: break-word;
            cursor: pointer;
        }

        .recipe-name:hover {
            color: #667eea;
        }

        .recipe-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .edit-btn {
            background: #e3f2fd;
        }

        .edit-btn:hover {
            background: #bbdefb;
        }

        .delete-btn {
            background: #ffebee;
        }

        .delete-btn:hover {
            background: #ffcdd2;
        }

        .recipe-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: none;
            line-height: 1.6;
        }

        .recipe-details.show {
            display: block;
        }

        .detail-row {
            margin-bottom: 10px;
        }

        .detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 14px;
        }

        .detail-value {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
            white-space: pre-wrap;
        }

        .edit-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        /* Zutaten deutlich größer, Kommentar etwas größer als vorher */
        textarea#editZutaten {
            min-height: 220px;
        }

        textarea#editKommentar {
            min-height: 110px;
        }

        .image-preview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            font-size: 13px;
            margin-top: 6px;
            color: #333;
        }

        .checkbox-row input {
            width: auto;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .save-btn {
            background: #28a745;
            color: white;
            flex: 1;
        }

        .save-btn:hover {
            background: #218838;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            flex: 1;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }

        .loading,         .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        /* Popup für "Neues Rezept" und "Anmelden" – groß, aber nicht Vollbild */
        .modal-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            padding: 24px;
        }

        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: min(640px, 100%);
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-box .recipe-name {
            cursor: default;
            margin-bottom: 4px;
        }

        @media (max-width: 768px) {
            .header {
                flex-wrap: wrap;
            }
            
            .title {
                width: 100%;
                margin-bottom: 10px;
            }

            .recipes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Rezepte</div>
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput"
                placeholder="Suche"
            >
            <select class="filter-select" id="filterSelect">
                <option value="alle">Alle</option>
                <option value="süß">Süß</option>
                <option value="herzhaft">Herzhaft</option>
            </select>
        </div>
        <button class="auth-btn" id="authBtn">🔑 Login</button>
        <button class="add-btn" id="addBtn">+</button>
    </div>

    <div class="recipes-grid" id="recipesContainer">
        <div class="loading">Lade Rezepte...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mzzpjcztfahnjvjzyirk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16enBqY3p0ZmFobmp2anp5aXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg2Mjc3OTgsImV4cCI6MjA4NDIwMzc5OH0.cOuygh4kK12P0nT2A1ZJ_BOjcl4Jiie3pHHrpgfzqEM';
        const BUCKET = 'rezept-bilder';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let recipes = [];
        let editingId = null;
        let editingBildUrl = null;
        let isLoggedIn = false;

        // ---------- Auth ----------

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            isLoggedIn = !!session;
            updateAuthUI();
            await loadRecipes();
        }

        db.auth.onAuthStateChange((_event, session) => {
            isLoggedIn = !!session;
            updateAuthUI();
            displayRecipes();
        });

        function updateAuthUI() {
            const authBtn = document.getElementById('authBtn');
            const addBtn = document.getElementById('addBtn');
            if (isLoggedIn) {
                authBtn.textContent = '🔓 Logout';
                authBtn.classList.add('logout');
                addBtn.style.display = 'flex';
            } else {
                authBtn.textContent = '🔑 Login';
                authBtn.classList.remove('logout');
                addBtn.style.display = 'none';
            }
        }

        document.getElementById('authBtn').addEventListener('click', () => {
            if (isLoggedIn) {
                doLogout();
            } else {
                openLoginModal();
            }
        });

        function openLoginModal() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'loginModalOverlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="recipe-top">
                        <div class="recipe-name">Anmelden</div>
                    </div>
                    <div class="edit-form">
                        <div class="form-group">
                            <label>E-Mail:</label>
                            <input type="email" id="loginEmail">
                        </div>
                        <div class="form-group">
                            <label>Passwort:</label>
                            <input type="password" id="loginPassword">
                        </div>
                        <div class="form-actions">
                            <button class="btn save-btn" onclick="doLogin()">🔑 Anmelden</button>
                            <button class="btn cancel-btn" onclick="closeLoginModal()">❌ Abbrechen</button>
                        </div>
                    </div>
                </div>
            `;
            overlay.addEventListener('click', (event) => {
                if (event.target === overlay) closeLoginModal();
            });
            document.body.appendChild(overlay);
            document.addEventListener('keydown', closeLoginModalOnEscape);
            document.getElementById('loginEmail').focus();
        }

        function closeLoginModal() {
            const overlay = document.getElementById('loginModalOverlay');
            if (overlay) overlay.remove();
            document.removeEventListener('keydown', closeLoginModalOnEscape);
        }

        function closeLoginModalOnEscape(event) {
            if (event.key === 'Escape') closeLoginModal();
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert('Bitte E-Mail und Passwort eingeben!');
                return;
            }

            try {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                closeLoginModal();
            } catch (error) {
                console.error('Login-Fehler:', error);
                alert('❌ Login fehlgeschlagen: ' + error.message);
            }
        }

        async function doLogout() {
            await db.auth.signOut();
        }

        // ---------- Rezepte laden & anzeigen ----------

        async function loadRecipes() {
            try {
                const { data, error } = await db
                    .from('rezepte')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                recipes = data || [];
                displayRecipes();
            } catch (error) {
                console.error('Fehler beim Laden:', error);
                document.getElementById('recipesContainer').innerHTML =
                    '<div class="no-results">❌ Fehler beim Laden der Rezepte</div>';
            }
        }

        function displayRecipes(filteredRecipes = null) {
            const container = document.getElementById('recipesContainer');
            const recipesToShow = filteredRecipes || recipes;

            if (recipesToShow.length === 0) {
                container.innerHTML = '<div class="no-results">Keine Rezepte gefunden</div>';
                return;
            }

            container.innerHTML = recipesToShow.map(recipe => `
                <div class="recipe-card" data-id="${recipe.id}">
                    ${recipe.bild_url ? `<img src="${recipe.bild_url}" alt="${recipe.name || ''}" class="recipe-image">` : ''}
                    <div class="recipe-top">
                        <div class="recipe-name" onclick="toggleDetails(${recipe.id})">${recipe.name || 'Unbenannt'}</div>
                        ${isLoggedIn ? `
                        <div class="recipe-actions">
                            <button class="icon-btn edit-btn" onclick="editRecipe(${recipe.id}); event.stopPropagation();">✏️</button>
                            <button class="icon-btn delete-btn" onclick="deleteRecipe(${recipe.id}); event.stopPropagation();">🗑️</button>
                        </div>` : ''}
                    </div>
                    <div class="recipe-details" id="details-${recipe.id}">
                        <div class="detail-row">
                            <div class="detail-label">Art:</div>
                            <div class="detail-value">${recipe.art || '-'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Zutaten:</div>
                            <div class="detail-value">${recipe.zutaten || '-'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Ort:</div>
                            <div class="detail-value">${recipe.ort || '-'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Kommentar:</div>
                            <div class="detail-value">${recipe.kommentar || '-'}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleDetails(id) {
            const details = document.getElementById(`details-${id}`);
            details.classList.toggle('show');
        }

        // ---------- Bearbeiten ----------

        function editRecipe(id) {
            if (!isLoggedIn) { alert('Bitte zuerst einloggen.'); return; }

            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            editingId = id;
            editingBildUrl = recipe.bild_url || null;

            const card = document.querySelector(`[data-id="${id}"]`);
            card.innerHTML = `
                <div class="recipe-top">
                    <div class="recipe-name">Bearbeiten</div>
                </div>
                <div class="edit-form">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="editName" value="${recipe.name || ''}">
                    </div>
                    <div class="form-group">
                        <label>Art:</label>
                        <select id="editArt" style="width: 100%; padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit;">
                            <option value="">-</option>
                            <option value="süß" ${recipe.art === 'süß' ? 'selected' : ''}>Süß</option>
                            <option value="herzhaft" ${recipe.art === 'herzhaft' ? 'selected' : ''}>Herzhaft</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bild:</label>
                        ${recipe.bild_url ? `<img src="${recipe.bild_url}" class="image-preview" alt="Aktuelles Bild">` : ''}
                        <input type="file" id="editBildFile" accept="image/*">
                        ${recipe.bild_url ? `
                        <label class="checkbox-row">
                            <input type="checkbox" id="editBildEntfernen"> Bild entfernen
                        </label>` : ''}
                    </div>
                    <div class="form-group">
                        <label>Zutaten:</label>
                        <textarea id="editZutaten">${recipe.zutaten || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Ort:</label>
                        <input type="text" id="editOrt" value="${recipe.ort || ''}">
                    </div>
                    <div class="form-group">
                        <label>Kommentar:</label>
                        <textarea id="editKommentar">${recipe.kommentar || ''}</textarea>
                    </div>
                    <div class="form-actions">
                        <button class="btn save-btn" onclick="saveRecipe()">💾 Speichern</button>
                        <button class="btn cancel-btn" onclick="cancelEdit()">❌ Abbrechen</button>
                    </div>
                </div>
            `;
        }

        function cancelEdit() {
            editingId = null;
            editingBildUrl = null;
            displayRecipes();
        }

        // ---------- Bild-Upload ----------

        async function uploadImage(file) {
            const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
            const path = `${Date.now()}_${safeName}`;

            const { error: uploadError } = await db.storage
                .from(BUCKET)
                .upload(path, file, { upsert: true });

            if (uploadError) throw uploadError;

            const { data } = db.storage.from(BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }

        // ---------- Speichern ----------

        async function saveRecipe() {
            const name = document.getElementById('editName').value;
            const art = document.getElementById('editArt').value;
            const zutaten = document.getElementById('editZutaten').value;
            const ort = document.getElementById('editOrt').value;
            const kommentar = document.getElementById('editKommentar').value;

            if (!name.trim()) {
                alert('Bitte gib einen Namen ein!');
                return;
            }

            const saveBtn = document.querySelector('.save-btn');
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.textContent = '⏳ Speichert...';
            }

            try {
                let bildUrl = editingBildUrl;

                const removeCheckbox = document.getElementById('editBildEntfernen');
                if (removeCheckbox && removeCheckbox.checked) {
                    bildUrl = null;
                }

                const fileInput = document.getElementById('editBildFile');
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    bildUrl = await uploadImage(fileInput.files[0]);
                }

                const payload = { name, art, zutaten, ort, kommentar, bild_url: bildUrl };

                if (editingId !== null) {
                    const { error } = await db
                        .from('rezepte')
                        .update(payload)
                        .eq('id', editingId);

                    if (error) throw error;
                    alert('✅ Rezept aktualisiert!');
                } else {
                    const { error } = await db
                        .from('rezepte')
                        .insert([payload]);

                    if (error) throw error;
                    alert('✅ Rezept gespeichert!');
                }

                editingId = null;
                editingBildUrl = null;
                closeAddModal();
                await loadRecipes();
            } catch (error) {
                console.error('Fehler beim Speichern:', error);
                alert('❌ Fehler beim Speichern: ' + error.message);
            } finally {
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '💾 Speichern';
                }
            }
        }

        // ---------- Löschen ----------

        async function deleteRecipe(id) {
            if (!isLoggedIn) { alert('Bitte zuerst einloggen.'); return; }

            const recipe = recipes.find(r => r.id === id);
            if (!confirm(`Rezept "${recipe.name}" wirklich löschen?`)) return;

            try {
                const { error } = await db
                    .from('rezepte')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('✅ Rezept gelöscht!');
                await loadRecipes();
            } catch (error) {
                console.error('Fehler beim Löschen:', error);
                alert('❌ Fehler beim Löschen: ' + error.message);
            }
        }

        // ---------- Neues Rezept (Popup) ----------

        function openAddModal() {
            if (!isLoggedIn) { alert('Bitte zuerst einloggen.'); return; }

            editingId = null;
            editingBildUrl = null;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'addModalOverlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="recipe-top">
                        <div class="recipe-name">Neues Rezept</div>
                    </div>
                    <div class="edit-form">
                        <div class="form-group">
                            <label>Name:</label>
                            <input type="text" id="editName">
                        </div>
                        <div class="form-group">
                            <label>Art:</label>
                            <select id="editArt" style="width: 100%; padding: 8px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit;">
                                <option value="">-</option>
                                <option value="süß">Süß</option>
                                <option value="herzhaft">Herzhaft</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Bild (optional):</label>
                            <input type="file" id="editBildFile" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Zutaten:</label>
                            <textarea id="editZutaten"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Ort:</label>
                            <input type="text" id="editOrt">
                        </div>
                        <div class="form-group">
                            <label>Kommentar:</label>
                            <textarea id="editKommentar"></textarea>
                        </div>
                        <div class="form-actions">
                            <button class="btn save-btn" onclick="saveRecipe()">💾 Speichern</button>
                            <button class="btn cancel-btn" onclick="closeAddModal()">❌ Abbrechen</button>
                        </div>
                    </div>
                </div>
            `;

            overlay.addEventListener('click', (event) => {
                if (event.target === overlay) closeAddModal();
            });

            document.body.appendChild(overlay);
            document.addEventListener('keydown', closeModalOnEscape);
            document.getElementById('editName').focus();
        }

        function closeAddModal() {
            const overlay = document.getElementById('addModalOverlay');
            if (overlay) overlay.remove();
            document.removeEventListener('keydown', closeModalOnEscape);
        }

        function closeModalOnEscape(event) {
            if (event.key === 'Escape') closeAddModal();
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            openAddModal();
        });

        // ---------- Suche & Filter ----------

        document.getElementById('searchInput').addEventListener('input', filterRecipes);
        document.getElementById('filterSelect').addEventListener('change', filterRecipes);

        function filterRecipes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterValue = document.getElementById('filterSelect').value;

            let filtered = recipes;

            if (filterValue !== 'alle') {
                filtered = filtered.filter(recipe =>
                    (recipe.art || '').toLowerCase() === filterValue
                );
            }

            if (searchTerm) {
                filtered = filtered.filter(recipe =>
                    (recipe.name || '').toLowerCase().includes(searchTerm) ||
                    (recipe.zutaten || '').toLowerCase().includes(searchTerm)
                );
            }

            displayRecipes(filtered);
        }

        init();
    </script>
</body>
</html>
